name: CI and release

on:
    push:
        branches: [main]
        tags:
            - "v*.*.*"
    pull_request:
        branches: [main]
    workflow_dispatch:
        inputs:
            tag:
                description: Existing version tag to publish
                required: true
                default: v1.0.5

jobs:
    npm-test:
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v6
              with:
                  node-version: '24'
            - run: npm test

    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Install uv
              uses: astral-sh/setup-uv@v7
              with:
                  version: ">=0.6.0"
                  enable-cache: true
            - name: Install Python
              run: uv python install
            - name: Install dependencies
              run: uv sync --locked --dev
            - run: uv run ruff check .
            - run: uv run ruff format --check .

    test:
        runs-on: ubuntu-latest
        needs: lint
        strategy:
            matrix:
                python-version: ["3.12", "3.13"]
        steps:
            - uses: actions/checkout@v4
            - name: Install uv
              uses: astral-sh/setup-uv@v7
              with:
                  version: ">=0.6.0"
                  python-version: ${{ matrix.python-version }}
                  enable-cache: true
            - name: Install dependencies
              run: uv sync --locked --all-extras --dev
            - name: Run tests
              run: uv run pytest -v

    build:
        runs-on: ubuntu-latest
        needs: [test, npm-test]
        # Only build on version tags (e.g. v1.2.3)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        steps:
            - uses: actions/checkout@v4
            - name: Install uv
              uses: astral-sh/setup-uv@v7
              with:
                  version: ">=0.6.0"
                  enable-cache: true
            - name: Verify tag matches pyproject.toml version
              run: |
                  RELEASE_TAG="${{ inputs.tag || github.ref_name }}"
                  TAG_VERSION=${RELEASE_TAG#v}
                  TOML_VERSION=$(grep '^version' pyproject.toml | head -1 | sed 's/version = "//;s/"//')
                  echo "Tag version:    $TAG_VERSION"
                  echo "pyproject.toml: $TOML_VERSION"
                  if [ "$TAG_VERSION" != "$TOML_VERSION" ]; then
                    echo "ERROR: Tag v$TAG_VERSION does not match pyproject.toml version $TOML_VERSION"
                    exit 1
                  fi
            - name: Build package (sdist + wheel)
              run: uv build
            - uses: actions/setup-node@v6
              with:
                  node-version: '24'
            - name: Build npm, plugin and skill bundles
              run: python scripts/prepare_release.py
            - name: Upload build artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: dist
                  path: dist/
                  retention-days: 7

    publish:
        runs-on: ubuntu-latest
        needs: build
        # Only publish on version tags (e.g. v1.2.3)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        environment: pypi
        permissions:
            # Required for PyPI Trusted Publishing (OIDC)
            id-token: write
        steps:
            - name: Download build artifacts
              uses: actions/download-artifact@v4
              with:
                  name: dist
                  path: dist/
            - name: Install uv
              uses: astral-sh/setup-uv@v7
              with:
                  version: ">=0.6.0"
            - name: Publish to PyPI
              run: uv publish dist/*.whl dist/*.tar.gz

    npm-publish:
        needs: [build, publish]
        runs-on: ubuntu-latest
        environment: npm
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: dist
                  path: packages
            - uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  registry-url: https://registry.npmjs.org
                  package-manager-cache: false
            - run: npm install --global npm@latest
            - name: Publish missing npm version
              shell: bash
              run: |
                  RELEASE_TAG="${{ inputs.tag || github.ref_name }}"
                  VERSION="${RELEASE_TAG#v}"
                  STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' "https://registry.npmjs.org/open-agent-search/$VERSION")
                  if [ "$STATUS" = "404" ]; then npm publish "./packages/open-agent-search-$VERSION.tgz" --access public --provenance; elif [ "$STATUS" != "200" ]; then exit 1; fi

    github-release:
        needs: [build, publish]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: dist
                  path: packages
            - name: Publish release assets
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  RELEASE_TAG="${{ inputs.tag || github.ref_name }}"
                  if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                      gh release upload "$RELEASE_TAG" packages/* --repo "$GITHUB_REPOSITORY" --clobber
                  else
                      gh release create "$RELEASE_TAG" packages/* --repo "$GITHUB_REPOSITORY" --title "Open Agent Search $RELEASE_TAG" --generate-notes
                  fi

    mcp-registry:
        needs: [publish, npm-publish]
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        permissions:
            contents: read
            id-token: write
        uses: ./.github/workflows/publish-mcp.yml

    agent-skills:
      needs: [publish, npm-publish]
      if: vars.PUBLISH_CLAWHUB == 'true' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
      permissions:
        contents: read
      uses: ./.github/workflows/publish-skills.yml
      secrets:
        CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
