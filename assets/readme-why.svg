<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">Before and after Open Agent Search</title>
  <desc id="desc">Without Open Agent Search an agent needs separate search integrations. With Open Agent Search it uses one connection for six capabilities.</desc>
  <rect width="1400" height="720" fill="#F4F0E7"/>
  <rect x="26" y="26" width="1348" height="668" fill="none" stroke="#151515" stroke-width="2"/>
  <text x="70" y="80" fill="#69655E" font-family="Courier New, monospace" font-size="14" font-weight="700" letter-spacing="2">INTEGRATION STUDY / 01</text>
  <text x="70" y="132" fill="#151515" font-family="Georgia, Times New Roman, serif" font-size="44" font-weight="700">From adapters to one search layer.</text>
  <line x1="70" y1="158" x2="1330" y2="158" stroke="#151515" stroke-width="2"/>

  <text x="70" y="208" fill="#69655E" font-family="Courier New, monospace" font-size="15" font-weight="700" letter-spacing="2">BEFORE OAS</text>
  <text x="770" y="208" fill="#69655E" font-family="Courier New, monospace" font-size="15" font-weight="700" letter-spacing="2">WITH OAS</text>
  <line x1="700" y1="186" x2="700" y2="630" stroke="#B9B3A8" stroke-width="1"/>

  <rect x="70" y="250" width="180" height="84" fill="#151515"/>
  <text x="160" y="286" fill="#F4F0E7" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Agent</text>
  <text x="160" y="312" fill="#F4F0E7" font-family="Courier New, monospace" font-size="12" text-anchor="middle">6 ADAPTERS</text>

  <line x1="250" y1="292" x2="310" y2="292" stroke="#151515" stroke-width="3"/>
  <path d="M298 282 L312 292 L298 302" fill="none" stroke="#151515" stroke-width="3"/>

  <g font-family="Courier New, monospace" font-size="15" font-weight="700">
    <rect x="326" y="214" width="142" height="56" fill="none" stroke="#151515" stroke-width="2"/><text x="397" y="248" fill="#151515" text-anchor="middle">WEB</text>
    <rect x="326" y="274" width="142" height="56" fill="none" stroke="#151515" stroke-width="2"/><text x="397" y="308" fill="#151515" text-anchor="middle">IMAGES</text>
    <rect x="326" y="334" width="142" height="56" fill="none" stroke="#151515" stroke-width="2"/><text x="397" y="368" fill="#151515" text-anchor="middle">VIDEO</text>
    <rect x="490" y="214" width="142" height="56" fill="none" stroke="#151515" stroke-width="2"/><text x="561" y="248" fill="#151515" text-anchor="middle">NEWS</text>
    <rect x="490" y="274" width="142" height="56" fill="none" stroke="#151515" stroke-width="2"/><text x="561" y="308" fill="#151515" text-anchor="middle">BOOKS</text>
    <rect x="490" y="334" width="142" height="56" fill="none" stroke="#151515" stroke-width="2"/><text x="561" y="368" fill="#151515" text-anchor="middle">PAGES</text>
  </g>

  <text x="70" y="466" fill="#151515" font-family="Georgia, Times New Roman, serif" font-size="27" font-style="italic">More integration work.</text>
  <text x="70" y="506" fill="#69655E" font-family="Arial, Helvetica, sans-serif" font-size="18">Different contracts, setup paths, and maintenance.</text>

  <rect x="770" y="250" width="180" height="84" fill="#151515"/>
  <text x="860" y="286" fill="#F4F0E7" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Agent</text>
  <text x="860" y="312" fill="#F4F0E7" font-family="Courier New, monospace" font-size="12" text-anchor="middle">1 CONNECTION</text>
  <line x1="950" y1="292" x2="1016" y2="292" stroke="#151515" stroke-width="3"/>
  <path d="M1004 282 L1018 292 L1004 302" fill="none" stroke="#151515" stroke-width="3"/>
  <rect x="1018" y="230" width="272" height="124" fill="#F4F0E7" stroke="#151515" stroke-width="3"/>
  <text x="1154" y="278" fill="#151515" font-family="Georgia, Times New Roman, serif" font-size="22" font-weight="700" text-anchor="middle">Open Agent Search</text>
  <text x="1154" y="310" fill="#69655E" font-family="Courier New, monospace" font-size="13" text-anchor="middle">STDIO · REST · HTTP MCP</text>
  <text x="1154" y="334" fill="#69655E" font-family="Courier New, monospace" font-size="12" text-anchor="middle">6 SEARCH SURFACES</text>

  <text x="770" y="466" fill="#151515" font-family="Georgia, Times New Roman, serif" font-size="27" font-style="italic">One stable interface.</text>
  <text x="770" y="506" fill="#69655E" font-family="Arial, Helvetica, sans-serif" font-size="18">Run it locally, or share it over HTTP.</text>

  <line x1="70" y1="574" x2="1330" y2="574" stroke="#B9B3A8" stroke-width="1"/>
  <text x="70" y="617" fill="#69655E" font-family="Courier New, monospace" font-size="13">LOCAL FIRST</text>
  <text x="700" y="617" fill="#151515" font-family="Courier New, monospace" font-size="13" text-anchor="middle">NO OAS ACCOUNT · NO PROVIDER API KEY</text>
  <text x="1330" y="617" fill="#69655E" font-family="Courier New, monospace" font-size="13" text-anchor="end">SELF-HOSTABLE</text>
</svg>
